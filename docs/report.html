<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남코녀 스타일링 리포트</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root { --brown:#7a5a43; --ink:#2b2420; --muted:#7a6e66; --line:#d9cfc4; --hl:#fff27a; --paper:#fffdf9; --bg:#ece8e2; color-scheme: light; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR", system-ui, sans-serif; font-size:14px; line-height:1.6; }
.bar { position:sticky; top:0; z-index:5; background:#2b2420; color:#fff; padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.bar button { font:inherit; padding:6px 14px; border-radius:8px; border:0; background:#fff; color:#2b2420; cursor:pointer; }
.bar .cap { font-size:.82rem; opacity:.85; }
.page { width:min(210mm, 100%); min-height:297mm; margin:16px auto; background:var(--paper); padding:16mm 14mm; display:flex; flex-direction:column; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
@media (max-width:640px) { .page { min-height:auto; margin:0 0 10px; padding:20px 16px; } }
h1 { font-family:"Noto Serif KR", serif; font-size:3.6rem; margin:0; }
h2 { font-size:1.7rem; margin:0 0 6px; font-weight:700; } h2 small { font-size:.75rem; color:var(--muted); font-weight:400; margin-left:6px; }
.hd { background:var(--brown); color:#fff; text-align:center; font-size:.95rem; padding:7px; margin:8px 0 0; }
table { width:100%; border-collapse:collapse; border:1.5px solid var(--brown); }
td { border:1px solid var(--line); padding:8px 10px; vertical-align:middle; }
td.k { width:24%; text-align:center; font-weight:500; }
.chips span { white-space:nowrap; } .chips span + span::before { content:" / "; color:var(--muted); }
mark { background:var(--hl); padding:0 3px; font-weight:500; }
.grid { display:grid; gap:10px; } .g2 { grid-template-columns:repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3, minmax(0,1fr)); } .g4 { grid-template-columns:repeat(4, minmax(0,1fr)); } .g5 { grid-template-columns:repeat(5, minmax(0,1fr)); }
@media (max-width:640px) { .g4, .g5 { grid-template-columns:repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
figure { margin:0; } figure img { width:100%; display:block; border-radius:4px; background:#f1ede7; }
.cover-img img { aspect-ratio:3/4; object-fit:cover; }
.cover .cover-img { width:58%; margin:0 auto 10mm; }
.ph img { aspect-ratio:3/4; object-fit:cover; }
figcaption { font-size:.85rem; margin-top:4px; text-align:center; }
.rank { display:inline-block; border:1.5px solid var(--ink); padding:0 6px; font-weight:700; margin-right:6px; font-size:.8rem; }
.gl figcaption { text-align:left; }
.bar-c { height:12px; border-radius:3px; margin-top:4px; }
.cover { justify-content:center; }
.cover .brand { position:absolute; } .logo { font-family:"Noto Serif KR", serif; letter-spacing:.12em; text-align:right; font-size:1rem; }
.cover .t { border-left:3px solid var(--brown); padding-left:22px; margin-top:auto; margin-bottom:auto; }
.cover .sub { color:var(--brown); font-weight:700; font-size:2.4rem; margin-top:6px; }
.cover .meta { color:var(--muted); margin-top:20px; font-size:1.425rem; }
.formula li { margin:4px 0; }
.revisit { text-align:center; font-size:1.05rem; line-height:2.1; margin:auto 0; white-space:pre-line; }
.note { color:var(--muted); font-size:.82rem; }
.bodyinfo { grid-template-columns:minmax(0,2fr) minmax(0,3fr); align-items:start; margin-top:12px; }
.bodyimg img { aspect-ratio:3/4; object-fit:cover; }
.boneimg img { background:#fff; }
.bodytxt h4 { margin:10px 0 2px; font-size:.95rem; color:var(--brown); } .bodytxt h4:first-child { margin-top:0; }
.bodytxt p { margin:0; font-size:.88rem; line-height:1.6; }
.pair { margin-top:12px; } .pair img { aspect-ratio:3/4; object-fit:contain; background:#f1ede7; } .boneimg img, .pair .boneimg img { background:#fff; }
.duo { display:flex; aspect-ratio:3/4; background:#f1ede7; border-radius:4px; overflow:hidden; } .pair .duo img { flex:1 1 0; min-width:0; width:100%; height:100%; aspect-ratio:auto; object-fit:cover; border-radius:0; background:none; } .pair .duo:not(.two) img { object-fit:contain; }
.bodytxt.boxed { border:1.5px solid var(--brown); padding:12px 14px; }
figcaption.small { font-size:.75rem; color:var(--muted); line-height:1.45; text-align:left; }
.sw { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:8px; } .sw div { text-align:center; font-size:.78rem; } .sw i { display:block; height:44px; border-radius:6px; border:1px solid var(--line); margin-bottom:4px; }
@media (max-width:640px) { .sw { grid-template-columns:repeat(3, minmax(0,1fr)); } }
figure.sq img { aspect-ratio:1/1; object-position:center 30%; }
.ph.sq img { aspect-ratio:1/1; object-position:center 30%; }
.why { font-size:.8rem; color:var(--muted); margin-top:4px; line-height:1.45; }
.msg { max-width:640px; margin:15vh auto; background:#fff; padding:24px; border-radius:12px; }
@page { size:A4; margin:0; }
@media print {
  body { background:#fff; } .bar { display:none; }
  html, body { width:210mm; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .page { margin:0; box-shadow:none; width:210mm; height:297mm; min-height:0; overflow:hidden; page-break-after:always; break-after:page; }
  .page:last-child { page-break-after:auto; }
  .noprint { display:none; }
}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <button id="pdfdl" type="button">PDF 다운로드 (A4)</button>
  <button id="print" type="button">인쇄</button>
  <span class="cap" id="pdfcap">사진이 다 뜬 뒤에 누르세요. 휴대폰·PC 모두 A4 한 장씩 맞춰 PDF 파일로 받아져요. 고칠 게 있으면 관리자 화면 현장 기록에서 고치고 이 창을 새로고침하세요.</span>
</div>
<div id="out"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="nk-report.js?v=9"></script>
<script>
// PDF 모드(?pdf=1): 숨은 창에서 A4 폭으로 리포트를 그린 뒤 한 장씩 사진으로 찍어 PDF로 묶어요
const PDF_MODE = new URLSearchParams(location.search).has('pdf');
if (PDF_MODE) {
  const d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  Object.defineProperty(HTMLImageElement.prototype, 'src', { get() { return d.get.call(this); }, set(v) { if (!this.crossOrigin && /^https?:/.test(v) && !v.startsWith(location.origin)) this.crossOrigin = 'anonymous'; d.set.call(this, v); } });
  const load = (src) => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.append(sc); });
  window.makePdf = async (progress) => {
    await load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await document.fonts.ready;
    await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
    // html2canvas는 object-fit(칸에 맞춰 자르기)을 몰라서 사진이 눌려요 → 화면에 보이는 모양대로 미리 잘라 바꿔 둠
    for (const im of [...document.querySelectorAll('#out .page img')]) {
      const cs = getComputedStyle(im), fit = cs.objectFit;
      const w = im.clientWidth, h = im.clientHeight, nw = im.naturalWidth, nh = im.naturalHeight;
      if (!(fit === 'cover' || fit === 'contain') || !w || !h || !nw || !nh) continue;
      const k = fit === 'cover' ? Math.max(w / nw, h / nh) : Math.min(w / nw, h / nh);
      const dw = nw * k, dh = nh * k;
      const pct = (v, d) => { v = String(v || '').trim(); if (v.endsWith('%')) return parseFloat(v) / 100; if (v === 'left' || v === 'top') return 0; if (v === 'right' || v === 'bottom') return 1; return d; };
      const [px, py] = cs.objectPosition.split(/\s+/);
      const S = 2, c = document.createElement('canvas'); c.width = Math.round(w * S); c.height = Math.round(h * S);
      const g = c.getContext('2d');
      try {
        g.drawImage(im, (w - dw) * pct(px, .5) * S, (h - dh) * pct(py, .5) * S, dw * S, dh * S);
        im.src = c.toDataURL(fit === 'cover' ? 'image/jpeg' : 'image/png', 0.9);
        im.style.objectFit = 'fill';
        await im.decode().catch(() => {});
      } catch (e) { /* 다른 사이트 사진이라 못 자르면 그대로 둠 */ }
    }
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const pages = [...document.querySelectorAll('#out .page')];
    for (let i = 0; i < pages.length; i++) {
      progress?.(i + 1, pages.length);
      const c = await html2canvas(pages[i], { scale: 2, useCORS: true, backgroundColor: '#fffdf9', logging: false });
      const h = Math.min(297, 210 * c.height / c.width);
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, 210, h);
    }
    return pdf.output('blob');
  };
}
(async () => {
  const cfg = window.NK_CONFIG, R = window.NK_REPORT;
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const out = document.getElementById('out');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fail = (t) => { const d = el('div', 'msg'); d.append(el('p', null, t)); out.replaceChildren(d); };
  const id = new URLSearchParams(location.search).get('id');
  if (!id) return fail('고객이 지정되지 않았어요. 관리자 화면의 "저장하고 고객 리포트 보기"로 열어 주세요.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return fail('관리자 로그인이 필요해요. 관리자 화면에서 로그인한 뒤 다시 열어 주세요.');
  const [sr, pr, orr, st] = await Promise.all([
    sb.from('surveys').select('*').eq('id', id).maybeSingle(),
    sb.from('plans').select('plan').eq('survey_id', id).maybeSingle(),
    sb.from('onsite').select('*').eq('survey_id', id).maybeSingle(),
    sb.from('stylist_uploads').select('*').eq('survey_id', id).order('created_at'),
  ]);
  const s = sr.data; if (!s) return fail('고객 정보를 불러오지 못했어요. (관리자 계정인지 확인해 주세요)');
  const P = pr.data?.plan || {}, o = orr.data || {}, rep = o.report || {};
  document.title = `[남코녀] ${s.name}님 스타일링 리포트`;

  // 비공개 사진 → 1시간짜리 주소
  const sign = async (bucket, paths) => { if (!paths.length) return []; const { data } = await sb.storage.from(bucket).createSignedUrls(paths, 3600); return (data || []).map((d) => d.signedUrl); };
  const photos = s.photos || {};
  const figA = P.figures?.analysis || [], figG = P.figures?.glasses || [];
  const hairAfter = (st.data || []).filter((r) => r.role === 'hair' && r.kind === 'after' && !/\.(mp4|mov|webm)$/i.test(r.path)).map((r) => r.path);
  // 현장에서 찍은 얼굴 3장·안경 사진 (있으면 사전 준비 그림보다 우선)
  const faceKeys = [['left', '왼쪽 얼굴'], ['front', '정면 얼굴'], ['right', '오른쪽 얼굴']].filter(([k]) => rep.face?.[k]);
  const glassKeys = Object.entries(rep.glass_photos || {}).filter(([, v]) => v);
  const [uOnFace, uOnGlass] = await Promise.all([sign('survey-photos', faceKeys.map(([k]) => rep.face[k])), sign('survey-photos', glassKeys.map(([, v]) => v))]);
  const bp = rep.body_photo || {};
  const one = async (path) => path ? (await sign('survey-photos', [path]))[0] : null;
  const [uFront, uSide] = await Promise.all([one(bp.front || (photos.body || [])[0]), one(bp.side || (photos.body || [])[1])]); // 체형 사진: 현장 정면/측면 → 없으면 사전질문 전신 1·2번째
  const onGlass = Object.fromEntries(glassKeys.map(([k], i) => [k, uOnGlass[i]]));
  const [uBody, uStyle, uFace, uFigA, uFigG, uShop, uLook, uHair] = await Promise.all([
    sign('survey-photos', photos.body || []), sign('survey-photos', photos.style || []), sign('survey-photos', photos.face || []),
    sign('survey-photos', figA.map((r) => r.path)), sign('survey-photos', figG.map((r) => r.path)), sign('survey-photos', rep.shop_photos || []),
    sign('lookbook', (P.lookbook || []).map((r) => r.key + '.jpg')), sign('stylist-uploads', hairAfter),
  ]);

  const page = () => { const p = el('section', 'page'); out.append(p); return p; };
  const head = (p, t, small) => { const h = el('h2', null, t); if (small) h.append(el('small', null, small)); p.append(h); };
  const hd = (p, t) => p.append(el('div', 'hd', t));
  const img = (url, alt, cls) => { const f = el('figure', cls); const i = el('img'); i.src = url; i.alt = alt; f.append(i); return f; };
  const chips = (opts, picked) => { const set = new Set([].concat(picked || []).filter(Boolean)); const d = el('div', 'chips'); opts.forEach((v) => { const sp = el('span'); if (set.has(v)) sp.append(el('mark', null, v)); else sp.textContent = v; d.append(sp); }); return d; };
  const table = (p, rows) => { const t = el('table'); rows.forEach(([k, v]) => { const tr = el('tr'); const td = el('td'); if (v instanceof Node) td.append(v); else td.textContent = v ?? ''; tr.append(el('td', 'k', k), td); t.append(tr); }); p.append(t); return t; };
  const has = (v) => Array.isArray(v) ? v.length > 0 : !!v;
  const won = (n) => n == null ? '' : Number(n).toLocaleString('ko-KR') + '원';

  // ---- 표지 ----
  const d0 = s.consult_date ? s.consult_date.slice(2).replace(/-/g, '.') : '';
  const c = page(); c.classList.add('cover'); c.append(el('div', 'logo', 'NAM CO NYEO'));
  const t = el('div', 't'); t.append(el('h1', null, `${s.name} 님`), el('div', 'sub', '맞춤 코디 컨설팅 리포트'), el('div', 'meta', `컨설팅 일자 : ${d0} ${s.consult_time || ''}`), el('div', 'meta', `담당 컨설턴트 : ${R.CONSULTANT}`));
  c.append(t);

  // (사전질문지 페이지는 리포트에서 뺌 — 대시보드에서만 봄)

  // ---- 01 체형 진단 (첫 번째 기준: A / I / O / H / V) ----
  const p3 = page(); head(p3, '01 체형 진단', '※ 참고용입니다');
  const bodyT = rep.body || o.body_type;
  const msr = [o.shoulder, o.waist, o.hip].every((x) => x != null) ? `${o.shoulder} / ${o.waist} / ${o.hip} cm` : '';
  hd(p3, '체형 (A · I · O · H · V)');
  table(p3, [['체형', chips(['A형', 'I형', 'O형', 'H형', 'V형'], bodyT)], ...(msr ? [['어깨 / 허리 / 골반', msr]] : [])]);
  // 체형 기준 사진 + 고객님 사진을 나란히, 설명은 아래 (고객 사진 없으면 기준 사진 옆에 설명)
  const typeBlock = (p, info, label, refCls, mine) => {
    if (!info) return;
    const txt = el('div', 'bodytxt'); [['특징', info.look], ['코디 방향', info.how], ['피하면 좋은 것', info.avoid]].forEach(([k, v]) => { if (v) txt.append(el('h4', null, k), el('p', null, v)); });
    if (info.img && mine) {
      const g = el('div', 'grid g2 pair'); const a = img(info.img, label, refCls); a.append(el('figcaption', null, label));
      const b = el('figure', 'mine'); const ims = el('div', 'duo'); [].concat(mine).filter(Boolean).forEach((u) => { const i = el('img'); i.src = u; i.alt = '고객님 사진'; ims.append(i); }); if (ims.children.length > 1) ims.classList.add('two'); b.append(ims, el('figcaption', null, `${s.name} 님`)); g.append(a, b); p.append(g);
      txt.classList.add('boxed'); p.append(txt);
    } else { const box = el('div', info.img ? 'grid bodyinfo' : 'grid'); if (info.img) box.append(img(info.img, label, refCls)); box.append(txt); p.append(box); }
  };
  { const k = [].concat(bodyT || [])[0]; typeBlock(p3, (R.BODY_INFO || {})[k], `${k} 체형`, 'bodyimg', uFront); }
  const bodyFigs = figA.map((r, i) => [r, uFigA[i]]).filter(([r]) => /body_/.test(r.path));
  if (bodyFigs.length) { const g = el('div', 'grid g2'); bodyFigs.forEach(([r, u]) => { const f = img(u, r.caption); f.append(el('figcaption', null, r.caption)); g.append(f); }); p3.append(g); }

  // ---- 01 체형 진단 (두 번째 기준: 골격) ----
  const p3b = page(); head(p3b, '01 체형 진단', '※ 참고용입니다');
  hd(p3b, '골격 (스트레이트 · 웨이브 · 내추럴)');
  table(p3b, [['골격', chips(R.BONE, o.bone)]]);
  if (o.exception) p3b.append(el('p', 'note', o.exception));
  { const k = [].concat(o.bone || [])[0]; typeBlock(p3b, (R.BONE_INFO || {})[k], `${k} 골격`, 'boneimg', uFront || uSide ? [uFront, uSide] : null); }

  // ---- 02 얼굴 진단 ----
  const p4 = page(); head(p4, '02 얼굴 진단');
  const faceFigs = figA.map((r, i) => [r, uFigA[i]]).filter(([r]) => /face_|head_/.test(r.path));
  if (faceKeys.length) { const g = el('div', 'grid g3'); faceKeys.forEach(([, l], i) => { const f = el('figure'); f.append(el('div', 'hd', l)); const im = img(uOnFace[i], l, 'ph sq'); f.append(im); g.append(f); }); p4.append(g); }
  else if (faceFigs.length) { const g = el('div', 'grid g3'); faceFigs.forEach(([r, u]) => { const f = img(u, r.caption); f.append(el('figcaption', null, r.caption)); g.append(f); }); p4.append(g); }
  else if (uFace.length) { const g = el('div', 'grid g3'); uFace.slice(0, 3).forEach((u, i) => g.append(img(u, '얼굴 ' + (i + 1), 'ph sq'))); p4.append(g); }
  { // 묶음별 표 (고른 값이 하나라도 있는 묶음만)
    const groups = []; R.FACE.forEach(([k, l, opts, , grp]) => { let gp = groups.find((x) => x.grp === grp); if (!gp) groups.push(gp = { grp, rows: [] }); gp.rows.push([k, l, opts]); });
    groups.forEach(({ grp, rows }) => {
      const extra = grp.startsWith('상') && rep.face_ratio ? [['실제 비율', rep.face_ratio]] : [];
      if (!rows.some(([k]) => has(rep[k])) && !extra.length) return;
      hd(p4, grp); table(p4, [...rows.map(([k, l, opts]) => [l, chips(opts, rep[k])]), ...extra]);
    });
  }

  // 코디 모음(lookbook) — 페이지마다 겹치지 않게 골라 씀
  const { data: lbAll } = await sb.from('lookbook').select('key,colors,style,items').eq('active', true);
  const shown = new Set((P.lookbook || []).map((r) => r.key));
  const opp = { '웜': '쿨', '쿨': '웜' }[o.color_temp];
  const colorScore = (c) => { c = c || ''; let n = 0; if (o.color_temp) n += c.includes(o.color_temp) ? 4 : c.includes('뉴트럴') ? 1 : 0; if (opp && c.includes(opp)) n -= 4; if (o.color_value && (c.includes(o.color_value) || (o.color_value !== '고명도' && c.includes('중저명도')))) n += 2; if (o.color_chroma && c.includes(o.color_chroma)) n += 1; if (o.color_clarity && c.includes(o.color_clarity)) n += 1; return n; };
  const pickLook = (score, n) => { const rows = (lbAll || []).filter((r) => !shown.has(r.key)).map((r) => ({ ...r, n: score(r) })).filter((r) => r.n > 0).sort((x, y) => y.n - x.n || x.key.localeCompare(y.key)).slice(0, n); rows.forEach((r) => shown.add(r.key)); return rows; };
  const lookGrid = async (p, rows, cap, cls = 'g4') => { if (!rows.length) return; const urls = await sign('lookbook', rows.map((r) => r.key + '.jpg')); const g = el('div', 'grid opt ' + cls); rows.forEach((r, i) => { const f = img(urls[i], r.colors || '', 'ph'); const t = cap(r); if (t) f.append(el('figcaption', 'small', t)); g.append(f); }); p.append(g); };
  const firstColors = (r) => (r.colors || '').split(/[,(]/)[0].trim();

  // ---- 03 컬러 진단 ----
  const pc = page(); head(pc, '03 컬러 진단');
  hd(pc, '퍼스널컬러');
  { const CI = R.COLOR_INFO || {}; const ct = el('table'); R.COLOR.forEach(([k, l, opts, grad]) => { const tr2 = el('tr'); const td2 = el('td'); td2.append(chips(opts, o[k])); const b = el('div', 'bar-c'); b.style.background = grad; td2.append(b); if (CI[o[k]]) td2.append(el('div', 'why', CI[o[k]])); tr2.append(el('td', 'k', l), td2); ct.append(tr2); }); pc.append(ct); }
  { // 잘 어울리는 색
    const pal = (R.PALETTE || {})[`${o.color_temp} ${o.color_value}`];
    if (pal) {
      hd(pc, '잘 어울리는 색'); const sw = el('div', 'sw'); pal.forEach(([n, hex]) => { const d = el('div'); const c = el('i'); c.style.background = hex; d.append(c, el('span', null, n)); sw.append(d); }); pc.append(sw);
      const av = (R.COLOR_AVOID || {})[o.color_temp]; if (av) pc.append(el('p', 'note', '피하면 좋은 색 : ' + av));
    }
  }
  if (o.color_temp || o.color_value) { // 퍼스널컬러에 맞는 코디 4개
    const rows = pickLook((r) => colorScore(r.colors), 4);
    if (rows.length) { hd(pc, '퍼스널컬러에 맞는 코디'); await lookGrid(pc, rows, firstColors); }
  }

  // ---- 04 이미지 진단 ----
  const pi = page(); head(pi, '04 이미지 진단');
  hd(pi, '어울리는 이미지'); const imT = el('table'); const tr = el('tr'); const td = el('td'); td.style.textAlign = 'center'; td.append(chips(R.IMAGE[0][2], rep.image)); tr.append(td); imT.append(tr); pi.append(imT);
  { const ims = [].concat(rep.image || []).filter((x) => (R.IMAGE_INFO || {})[x]); if (ims.length) table(pi, ims.map((x) => [x, R.IMAGE_INFO[x]])); }
  { // 추천 코디: 계획서에서 고른 코디 + 고른 이미지와 같은 스타일 코디로 6개까지 (색이 맞는 것 먼저)
    const ims = [].concat(rep.image || []);
    const extra = ims.length ? pickLook((r) => (ims.includes(r.style) ? 10 : 0) + (ims.includes(r.style) ? Math.max(colorScore(r.colors), 0) : 0), Math.max(0, 6 - uLook.length)) : [];
    if (uLook.length || extra.length) {
      hd(pi, '추천 코디'); const g = el('div', 'grid opt g3');
      uLook.forEach((u, i) => { const f = img(u, '추천 코디 ' + (i + 1), 'ph'); const why = (P.lookbook || [])[i]?.reason; if (why) f.append(el('figcaption', 'small', why)); g.append(f); });
      pi.append(g);
      if (extra.length) { const urls = await sign('lookbook', extra.map((r) => r.key + '.jpg')); extra.forEach((r, i) => { const f = img(urls[i], r.style, 'ph'); f.append(el('figcaption', 'small', `${r.style} · ${firstColors(r)}`)); g.append(f); }); }
    }
  }

  // ---- 05 스타일 방향성 ----
  const gl = rep.glasses || {};
  const glList = R.GLASSES.map(([k, l]) => { const i = figG.findIndex((r) => r.path.includes('glasses_' + k)); return { k, l, rank: gl[k], url: onGlass[k] || (i >= 0 ? uFigG[i] : null) }; }).filter((x) => x.rank || x.url);
  const glPhotos = glList.some((x) => x.url);
  // 안경 사진이 있을 때만 한 페이지를 따로 씀 (없으면 아래 스타일 표에 한 줄로)
  const p5 = glPhotos ? page() : null; if (p5) head(p5, '05 스타일 방향성');
  if (p5) {
    const ord = (r) => { const i = R.GLASS_RANKS.indexOf(r); return i < 0 ? 9 : i; };
    glList.sort((a, b) => ord(a.rank) - ord(b.rank));
    const g = el('div', 'grid g2 gl');
    glList.forEach((x) => { const f = x.url ? img(x.url, x.l) : el('figure'); const cap = el('figcaption'); if (x.rank) cap.append(el('span', 'rank', x.rank)); cap.append(x.l); f.prepend(cap); g.append(f); });
    p5.append(g);
  }
  const p6 = page(); head(p6, '05 스타일 방향성');
  R.STYLE.forEach(([group, rows]) => { hd(p6, group); table(p6, rows.map(([k, l, opts]) => [l, chips(opts, rep[k])])); });
  if (!glPhotos && glList.length) {
    hd(p6, '안경'); const ord = (r) => { const i = R.GLASS_RANKS.indexOf(r); return i < 0 ? 9 : i; };
    table(p6, glList.slice().sort((a, b) => ord(a.rank) - ord(b.rank)).map((x) => [x.rank || '', x.l]));
  }
  { // 고른 상의·하의·아우터와 비슷한 아이템이 들어간 코디 3개
    const MAP = { '카라넥': '셔츠', '터틀넥': '터틀', '브이넥': '브이', '헨리넥': '헨리', '울·캐시미어': '코트', '나일론': '나일론', '면(코튼)': '코튼', '슬림 일자핏': '슬랙스', '와이드 일자핏': '와이드', '둥근핏(커브드)': '커브드', '세미와이드': '와이드', '엑스트라 와이드': '와이드' };
    const toks = [...new Set(R.STYLE.flatMap(([, rows]) => rows.flatMap(([k]) => [].concat(rep[k] || []))).map((v) => MAP[v] || v.replace(/\(.*\)|핏|넥$/g, '').trim()).filter((v) => v.length > 1))];
    const rows = toks.length ? pickLook((r) => toks.filter((t) => (r.items || '').includes(t)).length * 3 + Math.max(colorScore(r.colors), 0) / 10, 4) : [];
    if (rows.length) { hd(p6, '이렇게 입어 보세요'); await lookGrid(p6, rows, (r) => (r.items || '').split(',')[0].trim(), 'g4'); p6.lastElementChild.querySelectorAll('figure').forEach((f) => f.classList.add('sq')); }
  }

  // ---- 06 헤어스타일 ----
  const p7 = page(); head(p7, '06 헤어스타일');
  hd(p7, '헤어 진단'); table(p7, R.HAIR.map(([k, l, opts]) => [l, chips(opts, rep[k])]));
  hd(p7, '추천하는 헤어스타일'); table(p7, [['앞머리 기장', rep.hair_bangs], ['추천하는 헤어스타일', rep.hair_style], ['헤어샵 요청 멘트', rep.hair_request]]);
  { // 고른 헤어스타일 사진 (없으면 추천 문구에 이름이 들어 있는 스타일로)
    const list = R.HAIR_STYLES || [];
    let names = [].concat(rep.hair_pick || []).filter(Boolean);
    if (!names.length && rep.hair_style) names = list.map(([n]) => n).filter((n) => rep.hair_style.replace(/\s/g, '').includes(n.replace(/\s|\(.*\)/g, '')));
    const picks = [];
    for (const n of names.slice(0, 2)) {
      const nums = (list.find(([x]) => x === n) || [, []])[1];
      if (!nums.length) continue;
      (await sign('lookbook', nums.map((x) => `hair/IMG_${x}.jpg`))).filter(Boolean).forEach((u) => picks.push([n, u]));
    }
    if (picks.length) {
      hd(p7, '추천 헤어스타일 사진');
      const g = el('div', 'grid opt g4'); picks.forEach(([n, u]) => { const f = img(u, n, 'ph'); f.append(el('figcaption', null, n)); g.append(f); }); p7.append(g);
    }
  }
  if (uHair.length) { hd(p7, '헤어 시술 후'); const g = el('div', 'grid g2'); uHair.slice(0, 2).forEach((u, i) => g.append(img(u, '헤어 시술 후 ' + (i + 1), 'ph'))); p7.append(g); }

  // ---- 07 동행쇼핑 ----
  const p8 = page(); head(p8, '07 동행쇼핑');
  if (uShop.length) { const g = el('div', 'grid g3'); uShop.slice(0, 6).forEach((u, i) => g.append(img(u, '동행쇼핑 ' + (i + 1), 'ph'))); p8.append(g); }
  const buys = rep.purchases || [];
  if (buys.length) {
    hd(p8, '구매 리스트'); const by = {}; buys.forEach((b) => { (by[b.brand || '기타'] = by[b.brand || '기타'] || []).push(b); });
    const t3 = el('table'); const td3 = el('td'); Object.entries(by).forEach(([brand, items]) => td3.append(el('div', null, `${brand} : ${items.map((b) => `${b.item}${b.size ? `(${b.size})` : ''}${b.price ? ' ' + won(b.price) : ''}`).join(', ')}`)));
    const total = buys.reduce((a, b) => a + (b.price || 0), 0); if (total) td3.append(el('div', 'note', `총 ${buys.length}개 · ${won(total)}`));
    const tr3 = el('tr'); tr3.append(td3); t3.append(tr3); p8.append(t3);
  }
  if (has(rep.formulas)) { hd(p8, '나만의 스타일링 공식'); const t4 = el('table'); const td4 = el('td'); const ol = el('ol', 'formula'); rep.formulas.forEach((x) => ol.append(el('li', null, x))); td4.append(ol); const tr4 = el('tr'); tr4.append(td4); t4.append(tr4); p8.append(t4); }
  const tips = buys.filter((b) => b.tip);
  if (tips.length) { hd(p8, '아이템별 스타일링 TIP'); table(p8, tips.map((b) => [`${b.brand}\n${b.item}`, b.tip])).querySelectorAll('td.k').forEach((x) => { x.style.whiteSpace = 'pre-line'; }); }
  if (!buys.length && !uShop.length) p8.append(el('p', 'note noprint', '구매 리스트와 동행쇼핑 사진은 관리자 화면 현장 기록에서 입력하면 여기에 나와요.'));

  // 한 페이지(A4)를 넘치면: 코디 사진을 정사각형으로 → 그래도 넘치면 뒤에서부터 사진을 뺌
  if (innerWidth > 640) {
    const mm = el('div'); mm.style.height = '297mm'; document.body.append(mm); const limit = mm.getBoundingClientRect().height + 1; mm.remove();
    out.querySelectorAll('.page').forEach((p) => {
      const over = () => p.getBoundingClientRect().height > limit;
      const grids = [...p.querySelectorAll('.grid.opt')];
      for (const g of grids.slice().reverse()) { if (!over()) break; g.querySelectorAll('figure').forEach((f) => f.classList.add('sq')); }
      for (const g of grids.slice().reverse()) { for (let w = 90; w >= 60 && over(); w -= 10) { g.style.width = w + '%'; g.style.margin = '0 auto'; } }
      for (const g of grids.slice().reverse()) {
        while (over() && g.children.length > 2) g.lastElementChild.remove();
        if (over()) { const h = g.previousElementSibling; g.remove(); if (h?.classList.contains('hd')) h.remove(); }
      }
    });
  }
  window.NK_READY = true;
  if (PDF_MODE) return;
  document.getElementById('bar').hidden = false;
  document.getElementById('print').onclick = () => window.print();
  const btn = document.getElementById('pdfdl');
  const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
  let ready = null; // 만들어 둔 PDF (휴대폰은 한 번 더 눌러야 저장 창이 떠요)
  const save = async (file) => {
    if (mobile && navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
  };
  btn.onclick = async () => {
    if (ready) { await save(ready); return; }
    btn.disabled = true; btn.textContent = 'PDF 준비 중…';
    const fr = document.createElement('iframe');
    fr.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1200px;border:0;';
    fr.src = location.pathname + location.search + '&pdf=1';
    document.body.append(fr);
    try {
      await new Promise((ok, no) => { const t0 = Date.now(); const tick = () => { if (fr.contentWindow?.NK_READY) ok(); else if (Date.now() - t0 > 60000) no(new Error('시간 초과')); else setTimeout(tick, 300); }; tick(); });
      const blob = await fr.contentWindow.makePdf((i, n) => { btn.textContent = `PDF 만드는 중… (${i}/${n})`; });
      const file = new File([blob], document.title.replace(/[\/:*?"<>|]/g, '') + '.pdf', { type: 'application/pdf' });
      if (mobile) { ready = file; btn.textContent = '✅ 완성! 눌러서 저장'; }
      else { await save(file); btn.textContent = 'PDF 다운로드 (A4)'; }
    } catch (e) {
      alert('PDF를 만들지 못했어요: ' + e.message + ' — "인쇄" 버튼으로 저장해 주세요.');
      btn.textContent = 'PDF 다운로드 (A4)';
    } finally { fr.remove(); btn.disabled = false; }
  };
})();
</script>
</body>
</html>
