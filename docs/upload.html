<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>남코녀 헤어·메이크업 사진 보내기</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500&display=swap">
<style>
:root { --bg:#f6f4f1; --card:#fff; --fg:#1d1b19; --muted:#6f6a64; --line:#e3ded7; --accent:#2b2a28; --accent-fg:#fff; --bad:#b3261e; --ok:#2e6b3f; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#151413; --card:#1f1e1c; --fg:#f1eee9; --muted:#a39d95; --line:#34312d; --accent:#f1eee9; --accent-fg:#151413; --bad:#f2b8b5; --ok:#9fd3a9; color-scheme: dark; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans KR", system-ui, sans-serif; font-size:16px; line-height:1.6; }
.wrap { max-width:600px; margin:0 auto; padding-block:28px 80px; padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); display:flex; flex-direction:column; gap:14px; }
.brand { font-size:.8rem; letter-spacing:.15em; color:var(--muted); }
h1 { font-family:"Noto Serif KR", serif; font-weight:500; font-size:1.6rem; margin:0; }
h2 { font-size:1.05rem; margin:0; }
p { margin:0; }
.muted { color:var(--muted); } .hint { color:var(--muted); font-size:.88rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px; }
.me { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; }
.me b { font-size:1.15rem; }
.tag { font-size:.8rem; padding:1px 10px; border-radius:999px; border:1px solid currentColor; }
.custs { display:flex; flex-direction:column; gap:8px; }
.cust { text-align:left; font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; align-items:center; }
.cust[aria-pressed="true"] { border-color:var(--fg); box-shadow:inset 3px 0 0 var(--fg); }
.cust .when { color:var(--muted); font-size:.88rem; }
.cust .sent { font-size:.8rem; color:var(--ok); white-space:nowrap; }
textarea { width:100%; font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:70px; resize:vertical; }
.files { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
.files figure { margin:0; position:relative; aspect-ratio:3/4; border-radius:8px; overflow:hidden; background:var(--line); }
.files img { width:100%; height:100%; object-fit:cover; display:block; }
.files button { position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; cursor:pointer; }
.pick { font:inherit; border:1px dashed var(--muted); border-radius:10px; padding:12px; background:transparent; color:var(--fg); cursor:pointer; }
.submit { font:inherit; font-weight:700; font-size:1.05rem; padding:16px; border:0; border-radius:12px; background:var(--accent); color:var(--accent-fg); cursor:pointer; }
.submit[disabled] { opacity:.5; cursor:progress; }
.err { color:var(--bad); font-size:.9rem; } .ok { color:var(--ok); }
button:focus-visible, textarea:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">NAMCONYEO · 남코녀</div>
  <h1>헤어·메이크업 사진 보내기</h1>

  <section class="card" id="bad" hidden>
    <h2>링크를 확인해 주세요</h2>
    <p class="muted">이 링크는 사용할 수 없어요. 남코녀 대표님께 문의해 주세요.</p>
  </section>

  <div id="main" hidden style="display:flex;flex-direction:column;gap:14px">
    <section class="card">
      <div class="me"><b id="me">—</b><span class="tag" id="role"></span></div>
      <p class="hint">고객을 고르고 비포·애프터 사진을 보내 주세요.</p>
    </section>

    <section class="card">
      <h2>고객 선택</h2>
      <div class="custs" id="custs"></div>
      <p class="hint" id="nocust" hidden>지금 고를 수 있는 고객이 없어요. 대표님이 컨설팅 일정을 등록하면 여기에 나타나요.</p>
    </section>

    <form id="f" hidden style="display:flex;flex-direction:column;gap:14px">
      <section class="card" data-kind="before">
        <h2>비포 사진</h2>
        <p class="hint">시술 전 정면·측면 사진</p>
        <div class="files"></div>
        <button type="button" class="pick">＋ 사진 추가</button>
        <input type="file" accept="image/*" multiple hidden>
      </section>
      <section class="card" data-kind="after">
        <h2>애프터 사진</h2>
        <p class="hint">시술 후 정면·측면 사진</p>
        <div class="files"></div>
        <button type="button" class="pick">＋ 사진 추가</button>
        <input type="file" accept="image/*" multiple hidden>
      </section>
      <section class="card">
        <h2>메모 (선택)</h2>
        <textarea id="note" maxlength="500" placeholder="예) 6:4 가르마, 옆머리 다운펌. 드라이 후 왁스 조금"></textarea>
      </section>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="submit" id="submit" type="submit">보내기</button>
    </form>

    <section class="card" id="done" hidden>
      <h2 class="ok">보냈어요. 감사합니다!</h2>
      <p class="muted" id="donemsg"></p>
      <button type="button" class="pick" id="more">다른 사진 더 보내기</button>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const cfg = window.NK_CONFIG;
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  const token = new URLSearchParams(location.search).get('t') || '';
  const MAX_BYTES = 50 * 1024 * 1024;
  const ROLE = { hair: '헤어', makeup: '메이크업' };
  const KIND = { before: '비포', after: '애프터' };
  const files = { before: [], after: [] };
  let me = null, picked = null;
  const $ = (s, r = document) => r.querySelector(s);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const fmtDate = (d) => { if (!d) return ''; const [, m, day] = d.split('-'); const w = '일월화수목금토'[new Date(d + 'T00:00:00').getDay()]; return `${+m}/${+day}(${w})`; };

  async function load() {
    if (!/^[A-Za-z0-9_-]{16,}$/.test(token)) { $('#bad').hidden = false; return; }
    const { data, error } = await sb.rpc('staff_info', { t: token });
    if (error || !data) { $('#bad').hidden = false; return; }
    me = data;
    $('#main').hidden = false;
    $('#me').textContent = [data.salon, data.name].filter(Boolean).join(' ');
    $('#role').textContent = ROLE[data.role] || data.role;
    renderCustomers();
  }

  function renderCustomers() {
    const box = $('#custs'); box.replaceChildren();
    const list = me.customers || [];
    $('#nocust').hidden = list.length > 0;
    list.forEach((c) => {
      const b = el('button', 'cust'); b.type = 'button'; b.setAttribute('aria-pressed', String(picked && picked.id === c.id));
      const left = el('span'); left.append(el('b', null, c.label + ' 님'), el('br'), el('span', 'when', [fmtDate(c.date), c.time, c.service].filter(Boolean).join(' · ')));
      b.append(left);
      if (c.sent) b.append(el('span', 'sent', `보낸 사진 ${c.sent}장`));
      b.addEventListener('click', () => { picked = c; renderCustomers(); $('#f').hidden = false; $('#done').hidden = true; $('#err').hidden = true; $('#f').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      box.append(b);
    });
  }

  const sections = [...document.querySelectorAll('[data-kind]')];
  function render(sec) {
    const kind = sec.dataset.kind, grid = sec.querySelector('.files');
    grid.replaceChildren();
    files[kind].forEach((f, i) => {
      const fig = el('figure'); const im = el('img'); im.alt = ''; im.src = URL.createObjectURL(f);
      const del = el('button', null, '×'); del.type = 'button'; del.setAttribute('aria-label', '삭제');
      del.addEventListener('click', () => { files[kind].splice(i, 1); render(sec); });
      fig.append(im, del); grid.append(fig);
    });
  }
  sections.forEach((sec) => {
    const input = sec.querySelector('input[type=file]');
    sec.querySelector('.pick').addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      const bad = [];
      for (const f of input.files) { if (f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name)) files[sec.dataset.kind].push(f); else bad.push(f.name); }
      input.value = ''; render(sec);
      if (bad.length) fail(`사진만 보낼 수 있어요: ${bad.join(', ')}`);
    });
  });

  // 사진은 긴 변 2000px JPEG로 줄여서 올림 (변환이 안 되는 형식은 원본 그대로)
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const b = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.88));
      return b ? { blob: b, type: 'image/jpeg', ext: 'jpg' } : null;
    } catch { return null; }
  }
  const extOf = (f) => (f.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  function fail(msg) { const e = $('#err'); e.textContent = msg; e.hidden = false; }

  $('#f').addEventListener('submit', async (ev) => {
    ev.preventDefault(); $('#err').hidden = true;
    if (!picked) return fail('고객을 먼저 골라 주세요.');
    const queue = [];
    ['before', 'after'].forEach((k) => files[k].forEach((f) => queue.push([k, f])));
    if (!queue.length) return fail('보낼 사진을 추가해 주세요.');
    const btn = $('#submit'); btn.disabled = true;
    const note = $('#note').value.trim();
    let sent = 0;
    try {
      for (const [kind, f] of queue) {
        btn.textContent = `올리는 중… ${sent + 1}/${queue.length}`;
        let blob = f, type = f.type || 'image/jpeg', ext = extOf(f);
        const s = await shrink(f); if (s) { blob = s.blob; type = s.type; ext = s.ext; }
        if (blob.size > MAX_BYTES) throw new Error(`${f.name} 파일이 너무 커요.`);
        const path = `${token}/${picked.id}/${me.role}_${kind}_${Date.now()}_${sent + 1}.${ext}`;
        const up = await sb.storage.from('stylist-uploads').upload(path, blob, { contentType: type, upsert: false });
        if (up.error) throw new Error(up.error.message);
        const reg = await sb.rpc('staff_register_upload', { t: token, p_survey: picked.id, p_kind: kind, p_path: path, p_type: type, p_note: note });
        if (reg.error) throw new Error(reg.error.message);
        sent++;
      }
      files.before = []; files.after = []; sections.forEach(render); $('#note').value = '';
      $('#f').hidden = true; $('#done').hidden = false;
      $('#donemsg').textContent = `${picked.label} 님 ${ROLE[me.role]} 사진 ${sent}장을 남코녀 대표님께 보냈어요.`;
      picked = null; await load();
    } catch (e) {
      console.error(e);
      fail(`${sent}장까지 보내고 멈췄어요: ${e.message} 인터넷 연결을 확인하고 다시 눌러 주세요.`);
    } finally { btn.disabled = false; btn.textContent = '보내기'; }
  });
  $('#more').addEventListener('click', () => { $('#done').hidden = true; window.scrollTo({ top: 0, behavior: 'smooth' }); });

  load();
})();
</script>
</body>
</html>
