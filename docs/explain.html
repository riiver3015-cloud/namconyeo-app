<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>남코녀 스타일 설명</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 고객에게 화면을 보여주며 설명하는 모드 — 대표님 메모·AI 근거 표시(📏🔶❓)는 나오지 않음 */
:root { --brown:#7a5a43; --ink:#2b2420; --muted:#7a6e66; --line:#e4dbd1; --paper:#fffdf9; --soft:#f3eee8; color-scheme: light; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR", system-ui, sans-serif; -webkit-text-size-adjust:100%; }
.deck { height:100dvh; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; }
.deck::-webkit-scrollbar { display:none; }
.slide { flex:0 0 100%; height:100%; scroll-snap-align:start; overflow-y:auto; padding:calc(56px + env(safe-area-inset-top)) 20px calc(72px + env(safe-area-inset-bottom)); }
.in { max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
.kick { color:var(--brown); font-weight:700; letter-spacing:.08em; font-size:.85rem; }
h1 { font-family:"Noto Serif KR", serif; font-size:clamp(2rem, 7vw, 3.4rem); margin:0; line-height:1.25; }
h2 { font-size:clamp(1.6rem, 5.5vw, 2.4rem); margin:0; line-height:1.3; }
.big { font-size:clamp(1.05rem, 3.6vw, 1.35rem); line-height:1.7; margin:0; }
.muted { color:var(--muted); }
.tag { display:inline-block; background:var(--brown); color:#fff; border-radius:999px; padding:4px 14px; font-weight:700; font-size:clamp(1rem, 3.6vw, 1.25rem); margin:0 6px 6px 0; }
.tag.ghost { background:var(--soft); color:var(--ink); }
.two { display:grid; gap:18px; }
@media (min-width:760px) { .two { grid-template-columns:minmax(0,2fr) minmax(0,3fr); align-items:start; } }
.photos { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
.photos.one { grid-template-columns:minmax(0,1fr); }
@media (max-width:759px) { .photos img { max-height:46vh; } .photos.one img { width:auto; max-width:100%; margin:0 auto; } }
.photos img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; background:var(--soft); display:block; }
.photos figcaption { text-align:center; font-size:.85rem; color:var(--muted); margin-top:4px; }
figure { margin:0; }
.box { background:var(--soft); border-radius:14px; padding:16px 18px; }
.box h3 { margin:0 0 6px; font-size:1rem; color:var(--brown); }
.box p { margin:0; font-size:clamp(1rem, 3.4vw, 1.15rem); line-height:1.7; }
.box + .box { margin-top:10px; }
.sw { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
@media (min-width:760px) { .sw { grid-template-columns:repeat(6, minmax(0,1fr)); } }
.sw div { text-align:center; font-size:.9rem; } .sw i { display:block; height:64px; border-radius:12px; border:1px solid var(--line); margin-bottom:6px; }
.axes { display:flex; flex-wrap:wrap; gap:6px; }
.looks { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.looks img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; background:var(--soft); display:block; }
.looks figcaption { font-size:.8rem; color:var(--muted); margin-top:4px; line-height:1.4; }
.route { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
.route li { display:grid; grid-template-columns:40px minmax(0,1fr); gap:12px; position:relative; padding-bottom:16px; }
.route li::before { content:""; position:absolute; left:19px; top:40px; bottom:0; width:2px; background:var(--line); }
.route li:last-child::before { display:none; }
.route .n { width:40px; height:40px; border-radius:50%; background:var(--brown); color:#fff; display:grid; place-items:center; font-weight:700; font-size:1.1rem; }
.route li.opt .n { background:var(--soft); color:var(--brown); border:2px dashed var(--brown); }
.route .shop { font-size:clamp(1.1rem, 4vw, 1.35rem); font-weight:700; }
.route .fl { font-size:.85rem; color:var(--brown); font-weight:500; margin-left:6px; }
.route .what { margin:2px 0 0; font-size:clamp(.95rem, 3.3vw, 1.08rem); line-height:1.6; }
.route .won { font-size:.85rem; color:var(--muted); }
.cover { justify-content:center; min-height:100%; }
.cover .in { min-height:100%; justify-content:center; }
.toc { list-style:none; padding:0; margin:8px 0 0; display:flex; flex-direction:column; gap:10px; font-size:clamp(1.05rem, 3.8vw, 1.3rem); }
.toc li::before { content:attr(data-n); display:inline-block; width:2.2em; color:var(--brown); font-weight:700; }
.logo { font-family:"Noto Serif KR", serif; letter-spacing:.14em; color:var(--brown); }
.nav { position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; gap:14px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(rgba(255,253,249,0), var(--paper) 40%); pointer-events:none; }
.nav > * { pointer-events:auto; }
.nav button { font:inherit; width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:1.2rem; cursor:pointer; }
.dots { display:flex; gap:8px; } .dots i { width:8px; height:8px; border-radius:50%; background:var(--line); cursor:pointer; } .dots i.on { background:var(--brown); width:22px; border-radius:4px; }
.top { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:linear-gradient(var(--paper) 60%, rgba(255,253,249,0)); z-index:2; }
.top button { font:inherit; font-size:.85rem; border:0; background:none; color:var(--muted); cursor:pointer; padding:6px 4px; }
.figs { display:grid; gap:12px; grid-template-columns:minmax(0,1fr); }
@media (min-width:760px) { .figs { grid-template-columns:repeat(2, minmax(0,1fr)); align-items:start; } }
.figs img { width:auto; max-width:100%; height:auto; max-height:62vh; margin:0 auto; display:block; border-radius:12px; background:var(--soft); }
.figs figcaption { text-align:center; font-size:.9rem; color:var(--muted); margin-top:6px; font-weight:500; }
.figwhy { text-align:center; font-size:clamp(.95rem, 3.2vw, 1.05rem); line-height:1.6; margin:4px auto 0; max-width:34em; }
.fignote { text-align:center; color:var(--muted); font-size:.85rem; margin:6px 0 0; }
.boxes { display:grid; gap:10px; } .boxes .box + .box { margin-top:0; }
@media (min-width:760px) { .boxes { grid-template-columns:repeat(2, minmax(0,1fr)); } }
.hairs { display:grid; gap:16px; } @media (min-width:760px) { .hairs { grid-template-columns:repeat(2, minmax(0,1fr)); } }
.hhd { display:flex; align-items:center; gap:8px; margin-bottom:8px; } .hhd .tag { margin:0; } .hname { font-size:clamp(1.15rem, 4vw, 1.4rem); font-weight:700; }
@media (min-width:760px) { .hairs.n3 { grid-template-columns:repeat(3, minmax(0,1fr)); } }
.hp.one { grid-template-columns:minmax(0,1fr); } .hwhy { margin:8px 0 0; font-size:clamp(.95rem, 3.2vw, 1.05rem); line-height:1.6; }
.box p { white-space:pre-line; }
.hp { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; } .hp img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; background:var(--soft); display:block; }
.msg { max-width:560px; margin:20vh auto; padding:24px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<div class="top"><button id="close" aria-label="설명 모드 닫기">✕ 닫기</button><span class="logo">NAM CO NYEO</span></div>
<main class="deck" id="deck"><div class="msg" id="msg">불러오는 중…</div></main>
<div class="nav" id="nav" hidden><button id="prev" aria-label="이전">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="다음">›</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="nk-report.js?v=9"></script>
<script>
(async () => {
  const cfg = window.NK_CONFIG, R = window.NK_REPORT;
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const deck = document.getElementById('deck');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fail = (t) => { const m = document.getElementById('msg'); if (m) m.textContent = t; };
  const id = new URLSearchParams(location.search).get('id');
  document.getElementById('close').onclick = () => { if (history.length > 1) history.back(); else window.close(); };
  if (!id) return fail('고객이 지정되지 않았어요. 관리자 화면의 "고객에게 보여주기"로 열어 주세요.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return fail('관리자 로그인이 필요해요. 관리자 화면에서 로그인한 뒤 다시 열어 주세요.');
  const [sr, pr, orr] = await Promise.all([
    sb.from('surveys').select('*').eq('id', id).maybeSingle(),
    sb.from('plans').select('plan').eq('survey_id', id).maybeSingle(),
    sb.from('onsite').select('*').eq('survey_id', id).maybeSingle(),
  ]);
  const s = sr.data; if (!s) return fail('고객 정보를 불러오지 못했어요. (관리자 계정인지 확인해 주세요)');
  const P = pr.data?.plan || {}, o = orr.data || {}, rep = o.report || {};
  document.title = `${s.name}님 · 남코녀 스타일 설명`;

  // AI 초안 문장에서 대표님용 표시(📏🔶❓, 확인 메모)를 지워 고객용 문장으로
  const clean = (t) => String(t || '')
    .replace(/\([^()]*(❓|대표님|확인|규칙|기준)[^()]*\)/g, '')
    .replace(/[📏🔶❓]/gu, '')
    .replace(/최종\s*결정은\s*대표님\.?/g, '')
    .replace(/\s{2,}/g, ' ').replace(/\s+([,.)])/g, '$1').trim();
  const sign = async (bucket, paths) => { const ps = paths.filter(Boolean); if (!ps.length) return []; const { data } = await sb.storage.from(bucket).createSignedUrls(ps, 3600); return (data || []).map((d) => d.signedUrl); };
  const photos = s.photos || {}, bp = rep.body_photo || {};
  const [[uFront, uSide], [uFace]] = await Promise.all([
    sign('survey-photos', [bp.front || (photos.body || [])[0], bp.side || (photos.body || [])[1]]).then((u) => [u[0], u[1]]),
    sign('survey-photos', [rep.face?.front || (photos.face || [])[0]]),
  ]);

  const slides = [];
  let secN = 0;
  const slide = (kick, cls) => { const sec = el('section', 'slide ' + (cls || '')); const inn = el('div', 'in'); sec.append(inn); slides.push(sec); if (kick) inn.append(el('div', 'kick', String(++secN).padStart(2, '0') + ' ' + kick)); return inn; };
  const tags = (vals, ghost) => { const d = el('div'); [].concat(vals || []).filter(Boolean).forEach((v) => d.append(el('span', ghost ? 'tag ghost' : 'tag', v))); return d; };
  const box = (parent, title, text) => { if (!text) return; const b = el('div', 'box'); b.append(el('h3', null, title), el('p', null, text)); parent.append(b); };
  const pics = (list) => { const g = el('div', 'photos' + (list.length === 1 ? ' one' : '')); list.forEach(([u, cap]) => { const f = el('figure'); const i = el('img'); i.src = u; i.alt = cap; f.append(i, el('figcaption', null, cap)); g.append(f); }); return g; };
  const figs = (list) => { const g = el('div', 'figs'); list.forEach(([u, cap, why]) => { const f = el('figure'); const i = el('img'); i.src = u; i.alt = cap; f.append(i, el('figcaption', null, cap)); if (why) f.append(el('p', 'figwhy', why)); g.append(f); }); return g; };

  const bodyT = [].concat(o.body_type || rep.body || [])[0];
  const imgs = [].concat(rep.image || []).filter(Boolean);
  const hasColor = R.COLOR.some(([k]) => o[k]);
  const shop = (P.shopping || []).filter((r) => !/제외/.test(r.priority || ''));
  let hairNames = [].concat(rep.hair_pick || []).filter(Boolean);
  if (!hairNames.length && rep.hair_style) hairNames = (R.HAIR_STYLES || []).map(([n]) => n).filter((n) => rep.hair_style.replace(/\s/g, '').includes(n.replace(/\s|\(.*\)/g, '')));
  hairNames = hairNames.slice(0, 3);
  const hasHair = hairNames.length > 0 || !!rep.hair_style;

  // ---- 표지 ----
  const toc = [];
  if (bodyT) toc.push('체형');
  if (o.bone) toc.push('골격');
  if (rep.face_shape || imgs.length || P.marks?.marks?.face?.found || rep.face_ratio) toc.push('얼굴 · 이미지');
  if (hasColor) toc.push('어울리는 색');
  if (hasHair) toc.push('헤어스타일');
  if ((P.lookbook || []).length) toc.push('오늘 완성할 코디');
  if (shop.length) toc.push('오늘 쇼핑 동선');
  {
    const c = slide(null, 'cover');
    c.append(el('div', 'kick', 'TODAY’S STYLING'), el('h1', null, `${s.name} 님,\n오늘의 스타일 방향`));
    c.lastChild.style.whiteSpace = 'pre-line';
    const ul = el('ol', 'toc'); toc.forEach((t, i) => { const li = el('li', null, t); li.dataset.n = String(i + 1).padStart(2, '0'); ul.append(li); }); c.append(ul);
  }

  // ---- 체형 (A · I · O · H · V) : 고객 사진 + 그 체형 예시 사진 ----
  let bodyHost = null, boneHost = null;
  const exFig = (info, cap) => (info?.img ? [[info.img, cap]] : []);
  if (bodyT) {
    const c = slide('체형'); const bi = (R.BODY_INFO || {})[bodyT];
    c.append(el('h2', null, bodyT + ' 체형'));
    bodyHost = el('div'); c.append(bodyHost);
    bodyHost.append(figs([...(uFront ? [[uFront, '고객님 정면']] : []), ...exFig(bi, `${bodyT} 체형 예시`)]));
    const txt = el('div', 'boxes'); c.append(txt);
    if (bi) { box(txt, '체형 특징', bi.look); box(txt, '이렇게 입어요', bi.how); box(txt, '피하면 좋은 것', bi.avoid); }
  }
  // ---- 골격 (스트레이트 · 웨이브 · 내추럴) : 고객 사진 + 그 골격 예시 사진 ----
  if (o.bone) {
    const c = slide('골격'); const gi = (R.BONE_INFO || {})[o.bone];
    c.append(el('h2', null, o.bone + ' 골격'));
    boneHost = el('div'); c.append(boneHost);
    boneHost.append(figs([...(uFront ? [[uFront, '고객님 정면']] : []), ...exFig(gi, `${o.bone} 골격 예시`)]));
    const txt = el('div', 'boxes'); c.append(txt);
    if (gi) { box(txt, `${o.bone} 골격 특징`, gi.look); box(txt, '이렇게 입어요', gi.how); box(txt, '피하면 좋은 것', gi.avoid); }
    if (o.exception) box(txt, '고객님만의 포인트', o.exception);
  }

  // ---- 얼굴 · 이미지 : 얼굴형 결론 + 상·중·하안부 결론 ----
  const MK0 = P.marks?.marks || null;
  const mkFaceOk = !!(MK0?.face?.found && (P.marks?.paths || {}).face === (rep.face?.front || (photos.face || [])[0]));
  const faceShape = rep.face_shape || (mkFaceOk ? MK0.face.shape : '') || '';
  // 상·중·하안부를 평균(1 : 1 : 1)과 비교. 1단계 실측이 있으면 실측, 없으면 사진 위 선 기준
  const thirds = (() => {
    let r = null, src = '';
    const m = String(rep.face_ratio || '').match(/([\d.]+)\s*:\s*([\d.]+)\s*:\s*([\d.]+)/);
    if (m) { r = m.slice(1).map(Number); src = '실측'; }
    else if (mkFaceOk) { const F = MK0.face; const d = [F.brow_line.y - F.hairline.y, F.nose_base.y - F.brow_line.y, F.chin.y - F.nose_base.y]; if (d.every((x) => x > 0)) { r = d; src = '사진'; } }
    if (!r || !(r[0] > 0)) return null;
    const mean = (r[0] + r[1] + r[2]) / 3; const w = r.map((x) => (x / mean > 1.06 ? '긴 편' : x / mean < 0.94 ? '짧은 편' : '보통'));
    const diff = ['상안부', '중안부', '하안부'].map((n, i) => (w[i] === '보통' ? null : `${n}가 ${w[i]}`)).filter(Boolean);
    return { ratio: `1 : ${(r[1] / r[0]).toFixed(1)} : ${(r[2] / r[0]).toFixed(1)}`, src, text: diff.length ? `평균(1 : 1 : 1)과 비교하면 ${diff.join(', ')}이에요.` : '평균(1 : 1 : 1)에 가까운 균형 잡힌 비율이에요.' };
  })();
  let faceHost = null;
  if (faceShape || thirds || imgs.length) {
    const c = slide('얼굴 · 이미지');
    c.append(el('h2', null, [faceShape && faceShape + ' 얼굴', imgs.length && imgs.join(' · ') + ' 이미지'].filter(Boolean).join(' · ') || '얼굴 진단'));
    faceHost = el('div'); c.append(faceHost);
    if (uFace) faceHost.append(pics([[uFace, '얼굴']]));
    const txt = el('div', 'boxes'); c.append(txt);
    if (faceShape) box(txt, `얼굴 윤곽 · ${faceShape}`, (mkFaceOk && MK0.face.shape === faceShape && MK0.face.shape_note) || `얼굴 윤곽이 ${faceShape}에 가까워요.`);
    if (thirds) box(txt, `상 · 중 · 하안부 · ${thirds.ratio} (${thirds.src} 기준)`, thirds.text);
    imgs.forEach((x) => box(txt, x, (R.IMAGE_INFO || {})[x]));
  }

  // ---- 컬러 ----
  if (hasColor) {
    const c = slide('어울리는 색');
    c.append(el('h2', null, [o.color_temp, o.color_value, o.color_chroma, o.color_clarity].filter(Boolean).join(' · ')));
    const CI = R.COLOR_INFO || {};
    const txt = el('div', 'boxes'); c.append(txt);
    R.COLOR.forEach(([k, l]) => { if (o[k] && CI[o[k]]) box(txt, `${l} · ${o[k]}`, CI[o[k]]); });
    const pal = (R.PALETTE || {})[`${o.color_temp} ${o.color_value}`];
    if (pal) { const sw = el('div', 'sw'); pal.forEach(([n, hex]) => { const d = el('div'); const i = el('i'); i.style.background = hex; d.append(i, el('span', null, n)); sw.append(d); }); c.append(el('h3', null, '이 색들이 얼굴을 살려 줘요'), sw); }
    const av = (R.COLOR_AVOID || {})[o.color_temp]; if (av) c.append(el('p', 'big muted', '피하면 좋은 색 · ' + av));
  }

  // ---- 헤어스타일 (진단 한 줄 → 1~3순위 사진과 이유 → 처방 → 요청 멘트 → 홈 스타일링) ----
  if (hasHair) {
    const c = slide('헤어스타일');
    c.append(el('h2', null, hairNames.length ? hairNames[0] + (rep.hair_down === '필요' ? ' + 다운펌' : '') : rep.hair_style));
    if (rep.hair_diag) c.append(el('p', 'big', rep.hair_diag));
    if (hairNames.length) {
      const list = R.HAIR_STYLES || [];
      const g = el('div', 'hairs n' + hairNames.length);
      for (const [i, n] of hairNames.entries()) {
        const nums = (list.find(([x]) => x === n) || [, []])[1].slice(0, hairNames.length > 2 ? 1 : 2);
        const urls = await sign('lookbook', nums.map((x) => `hair/IMG_${x}.jpg`));
        const b = el('div', 'hair'); const hd = el('div', 'hhd'); hd.append(el('span', 'tag', `${i + 1}순위`), el('span', 'hname', n)); b.append(hd);
        const ph = el('div', 'hp' + (urls.length < 2 ? ' one' : '')); urls.filter(Boolean).forEach((u) => { const im = el('img'); im.src = u; im.alt = n; ph.append(im); }); b.append(ph);
        const why = (rep.hair_why || [])[i]; if (why) b.append(el('p', 'hwhy', why));
        g.append(b);
      }
      c.append(g);
    }
    const txt = el('div', 'boxes'); c.append(txt);

      if (ratio) label(g, ratio, c.width / 2, c.height - fs * 1.3, fs * 1.1, 'center');
    }
    return [A.c.toDataURL('image/jpeg', 0.88), B.c.toDataURL('image/jpeg', 0.88)];
  };

  // ---------- 저장된 좌표(Fable 5.2 가 사진을 보고 짚은 점)로 그리기 ----------
  // 좌표는 사진 왼쪽 위 (0,0) ~ 오른쪽 아래 (1000,1000)
  const MK = P.marks?.marks || null, MKP = P.marks?.paths || {};
  const pFront = bp.front || (photos.body || [])[0], pSide = bp.side || (photos.body || [])[1], pFace = rep.face?.front || (photos.face || [])[0];
  const hasM = (k, path) => !!(MK && MK[k]?.found && path && MKP[k] === path); // 사진이 바뀌었으면 쓰지 않음
  const px = (im, p) => [p.x / 1000 * im.naturalWidth, p.y / 1000 * im.naturalHeight];
  const tick = (g, x, y, h, lw) => line(g, x, y - h, x, y + h, lw);

  const bodyFigM = (im, B) => {
    const H = im.naturalHeight; const top = B.head_top.y / 1000 * H, bot = B.feet_bottom.y / 1000 * H, ch = (bot - top) * 1.1, cw = ch * 0.75;
    const cx = (px(im, B.shoulder_left)[0] + px(im, B.shoulder_right)[0]) / 2;
    const { c, g, X, Y } = crop(im, cx - cw / 2, top - (bot - top) * 0.06, cw, ch, 900);
    const lw = c.width * 0.009, fs = c.width * 0.04;
    const rows = [['어깨', B.shoulder_left, B.shoulder_right], ['허리', B.waist_left, B.waist_right], ['골반', B.hip_left, B.hip_right]].map(([n, l, r]) => [n, px(im, l), px(im, r)]);
    path(g, [rows[0][1], rows[0][2], rows[1][2], rows[2][2], rows[2][1], rows[1][1]].map(([x, y]) => [X(x), Y(y)]), lw * 0.7, [lw * 2, lw * 2], 'rgba(255,201,40,.18)');
    rows.forEach(([n, l, r]) => { const xl = X(l[0]), yl = Y(l[1]), xr = X(r[0]), yr = Y(r[1]); line(g, xl, yl, xr, yr, lw); tick(g, xl, yl, fs * 0.5, lw); tick(g, xr, yr, fs * 0.5, lw); label(g, n, xl - fs * 0.6, yl, fs, 'right'); });
    return c.toDataURL('image/jpeg', 0.88);
  };
  const boneStripM = (im, B, side) => {
    const H = im.naturalHeight; const top = B.head_top.y / 1000 * H, bot = B.feet_bottom.y / 1000 * H, ch = (bot - top) * 1.1, cw = ch * 0.42;
    const mid = side ? (px(im, B.chest_front)[0] + px(im, B.chest_back)[0] + px(im, B.hip_front)[0] + px(im, B.hip_back)[0]) / 4 : (px(im, B.shoulder_left)[0] + px(im, B.shoulder_right)[0]) / 2;
    const { c, g, X, Y } = crop(im, mid - cw / 2, top - (bot - top) * 0.06, cw, ch, 600);
    const lw = c.width * 0.013, fs = c.width * 0.06; const q = (p) => { const [x, y] = px(im, p); return [X(x), Y(y)]; };
    if (!side) {
      const n = q(B.neck_base), sl = q(B.shoulder_left), sr = q(B.shoulder_right), wl = q(B.waist_left), wr = q(B.waist_right);
      line(g, n[0], n[1], sl[0], sl[1], lw); line(g, n[0], n[1], sr[0], sr[1], lw);
      line(g, sl[0], sl[1], wl[0], wl[1], lw * 0.7, [lw * 2, lw * 2]); line(g, sr[0], sr[1], wr[0], wr[1], lw * 0.7, [lw * 2, lw * 2]);
      label(g, '어깨선', n[0], n[1] - fs * 1.3, fs, 'center');
    } else {
      [[B.chest_front, B.chest_back, '상체 두께'], [B.hip_front, B.hip_back, '하체 두께']].forEach(([a, b, name]) => {
        const p1 = q(a), p2 = q(b); line(g, p1[0], p1[1], p2[0], p2[1], lw); tick(g, p1[0], p1[1], fs * 0.4, lw); tick(g, p2[0], p2[1], fs * 0.4, lw);
        label(g, name, (p1[0] + p2[0]) / 2, Math.min(p1[1], p2[1]) - fs * 1.1, fs, 'center');
      });
    }
    return c;
  };
  const faceFigsM = (im, F, shape, ratio) => {
    const ol = F.outline.map((p) => px(im, p)); const hl = px(im, F.hairline), ch = px(im, F.chin);
    const xs = ol.map((p) => p[0]), ys = ol.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys, hl[1]), y1 = Math.max(...ys, ch[1]), fw = x1 - x0;
    const size = Math.max(fw * 2, (y1 - y0) * 1.5), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const mk = () => crop(im, cx - size / 2, cy - size / 2, size, size, 800);
    const A = mk(); { const { c, g, X, Y } = A; const lw = c.width * 0.008, fs = c.width * 0.045; const pts = ol.map(([x, y]) => [X(x), Y(y)]), n = pts.length;
      // 점들을 부드러운 곡선으로 이음
      const trace = () => { const mid = (i) => [(pts[i][0] + pts[(i + 1) % n][0]) / 2, (pts[i][1] + pts[(i + 1) % n][1]) / 2]; const m0 = mid(n - 1); g.beginPath(); g.moveTo(m0[0], m0[1]); for (let i = 0; i < n; i++) { const m = mid(i); g.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); } g.closePath(); };
      g.save(); g.lineJoin = 'round'; trace(); g.fillStyle = 'rgba(255,201,40,.12)'; g.fill(); trace(); g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = lw * 1.9; g.stroke(); trace(); g.strokeStyle = ACC; g.lineWidth = lw; g.stroke(); g.restore();
      if (shape) label(g, shape, c.width / 2, c.height - fs * 1.3, fs * 1.1, 'center');
    }
    const B = mk(); { const { c, g, X, Y } = B; const lw = c.width * 0.007, fs = c.width * 0.04;
      const xa = X(x0 - fw * 0.1), xb = X(x1 + fw * 0.1), bx = X(x1 + fw * 0.22);
      const yy = [F.hairline, F.brow_line, F.nose_base, F.chin].map((p) => Y(px(im, p)[1]));
      yy.forEach((y) => line(g, xa, y, xb, y, lw));
      ['상안부', '중안부', '하안부'].forEach((nm, i) => {
        line(g, bx, yy[i] + lw * 2, bx, yy[i + 1] - lw * 2, lw * 0.8);
        line(g, bx - fs * 0.25, yy[i] + lw * 2, bx + fs * 0.25, yy[i] + lw * 2, lw * 0.8); line(g, bx - fs * 0.25, yy[i + 1] - lw * 2, bx + fs * 0.25, yy[i + 1] - lw * 2, lw * 0.8);
        label(g, nm, bx + fs * 0.6, (yy[i] + yy[i + 1]) / 2, fs, 'left');
      });
      const d = [yy[1] - yy[0], yy[2] - yy[1], yy[3] - yy[2]];
      label(g, ratio || `1 : ${(d[1] / d[0]).toFixed(1)} : ${(d[2] / d[0]).toFixed(1)}`, c.width / 2, c.height - fs * 1.3, fs * 1.1, 'center');
    }
    return [A.c.toDataURL('image/jpeg', 0.88), B.c.toDataURL('image/jpeg', 0.88)];
  };
  // 점검용 (관리자 미리보기·테스트에서 같은 그림 함수를 씀)
  window.NK_DRAW = { loadImg, bodyFigM, boneStripM, joinStrips, faceFigsM };

  const note = (host, t) => { let n = host.querySelector('.fignote'); if (!n) { n = el('p', 'fignote'); host.append(n); } n.textContent = t; };
  try {
    if ((bodyHost || boneHost) && uFront) {
      [bodyHost, boneHost].filter(Boolean).forEach((h) => note(h, '분석 그림을 그리는 중…'));
      const mF = hasM('body_front', pFront), mS = hasM('body_side', pSide);
      const imF = mF ? await loadImg(uFront) : null, bf = mF ? null : await readBody(uFront);
      if (imF || bf) {
        if (bodyHost) bodyHost.replaceChildren(figs([[imF ? bodyFigM(imF, MK.body_front) : bodyFig(bf), '고객님 · 어깨 · 허리 · 골반', mF ? MK.body_front.note : ''], ...exFig((R.BODY_INFO || {})[bodyT], `${bodyT} 체형 예시`)]));
        if (boneHost) {
          const strips = [imF ? boneStripM(imF, MK.body_front, false) : boneStrip(bf, false)];
          if (uSide) { if (mS) strips.push(boneStripM(await loadImg(uSide), MK.body_side, true)); else { const bs = await readBody(uSide).catch(() => null); if (bs) strips.push(boneStrip(bs, true)); } }
          boneHost.replaceChildren(figs([[joinStrips(strips), `고객님 · ${strips.length > 1 ? '정면 / 측면' : '정면'}`, mS ? MK.body_side.note : ''], ...exFig((R.BONE_INFO || {})[o.bone], `${o.bone} 골격 예시`)]));
        }
      } else [bodyHost, boneHost].filter(Boolean).forEach((h) => note(h, ''));
    }
  } catch (e) { console.warn('body fig', e); [bodyHost, boneHost].filter(Boolean).forEach((h) => note(h, '')); }
  try {
    if (faceHost && uFace) {
      note(faceHost, '분석 그림을 그리는 중…');
      let pair = null, fnote = '';
      if (hasM('face', pFace) && (MK.face.outline || []).length >= 6) { pair = faceFigsM(await loadImg(uFace), MK.face, faceShape, thirds?.ratio || ''); fnote = thirds?.src === '실측' ? '' : MK.face.note; }
      else { const fb = await readFace(uFace); if (fb) pair = faceFigs(fb, faceShape, thirds?.ratio || ''); }
      if (pair) faceHost.replaceChildren(figs([[pair[0], faceShape ? `얼굴형 · ${faceShape}` : '얼굴 윤곽'], [pair[1], '상안부 · 중안부 · 하안부', fnote]]));
      else note(faceHost, '');
    }
  } catch (e) { console.warn('face fig', e); if (faceHost) note(faceHost, ''); }
  window.NK_FIGS = true;
})();
</script>
